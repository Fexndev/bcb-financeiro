name: Atualizar dados BCB

on:
  schedule:
    - cron: '0 12 5 * *'    # Dia 5 de cada mês, 09:00 BRT
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependências
        run: pip install -r scripts/requirements.txt

      - name: Coletar séries de crédito (SGS)
        working-directory: scripts
        run: python fetch_credito.py
        continue-on-error: true

      - name: Coletar taxas de juros
        working-directory: scripts
        run: python fetch_taxas.py
        continue-on-error: true

      - name: Coletar IF.data (demonstrações financeiras)
        working-directory: scripts
        run: python fetch_ifdata.py
        continue-on-error: true

      - name: Coletar dados geográficos
        working-directory: scripts
        run: python fetch_estban.py
        continue-on-error: true

      - name: Coletar ranking de reclamações
        working-directory: scripts
        run: python fetch_reclamacoes.py
        continue-on-error: true

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore: atualizar dados $(date +%Y-%m)"
          git push
